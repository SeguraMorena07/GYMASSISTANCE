version: '3.8'

services:
  mysql:
    container_name: mysql-servidor
    image: mysql:8-debian
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=asistenciasqr
    volumes:
      - ./dockers/mysql/_data:/var/lib/mysql
    networks:
      - mired

  backend:
    build: .
    container_name: asistenciasqr_backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - mysql
    networks:
      - mired

networks:
  mired:
    external: true
